  :root {
    --bg: #eceae2;
    --ink: #2b2a27;
    --muted: #7a776d;
    --gap: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 24px 64px;
  }
  header { max-width: 1400px; margin: 0 auto 40px; text-align: center; }
  h1 { font-family: "Season Serif", Cambria, Georgia, serif; font-weight: 400; font-size: clamp(2rem, 5vw, 3.6rem); letter-spacing: -0.01em; line-height: 1.1; }
  header p { color: var(--muted); margin-top: 6px; font-size: .95rem; }

  /* ---------- Tile grid ---------- */
  .grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: var(--gap);
  }
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;              /* keeps the zoom inside the frame */
    border-radius: 6px;
    background: #dcd9ce;
    cursor: zoom-in;
    border: 0;
    padding: 0;
    display: block;
    width: 100%;
  }
  .tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1);
    transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .4s ease;
    opacity: 0;
  }
  .tile img.loaded { opacity: 1; }
  .tile:hover img, .tile:focus-visible img { transform: scale(1.06); }
  .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .tile .dl {
    position: absolute; right: 10px; bottom: 10px;
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(236,234,226,.92); color: var(--ink);
    border: 0; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: transform .2s ease, background .2s ease;
  }
  .tile .dl:hover { transform: scale(1.08); background: #fff; }

  .status { max-width: 1400px; margin: 40px auto; color: var(--muted); text-align: center; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(20,19,17,.96);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 94vw; max-height: 88vh;
    object-fit: contain;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    user-select: none;
  }
  .lb-btn {
    position: absolute;
    background: rgba(236,234,226,.12);
    color: #eceae2;
    border: 1px solid rgba(236,234,226,.25);
    border-radius: 999px;
    height: 44px; min-width: 44px;
    padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: .9rem;
    cursor: pointer;
    transition: background .2s ease;
  }
  .lb-btn:hover { background: rgba(236,234,226,.25); }
  .lb-close { top: 18px; right: 18px; }
  .lb-download { top: 18px; right: 74px; }
  .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
  .lb-count {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(236,234,226,.7); font-size: .85rem; letter-spacing: .05em;
  }
  @media (max-width: 600px) {
    body { padding: 28px 16px 48px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .lb-prev, .lb-next { top: auto; bottom: 12px; transform: none; }
    .lb-count { bottom: 26px; }
  }
</style>
</head>
<body>

<header>
  <h1>Roarington Opening Night</h1>
  <p id="subtitle">Loading images…</p>
</header>

<main class="grid" id="grid"></main>
<div class="status" id="status"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <img id="lbImg" alt="">
  <button class="lb-btn lb-download" id="lbDownload" aria-label="Download image">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Download
  </button>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&#10005;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">&#8592;</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">&#8594;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
/* =========================================================
   Images come from the repo's "images" folder, deployed
   alongside this page on Vercel. At deploy time, build.js
   writes images.json listing the files in that folder.
   ========================================================= */
const CONFIG = { COUNT: 14 };

async function loadImageList() {
  const res = await fetch("images.json", { cache: "no-store" });
  if (!res.ok) throw new Error("images.json not found (it is generated by build.js on deploy)");
  const names = await res.json();
  return names.slice(0, CONFIG.COUNT).map(name => ({
    name,
    url: "images/" + encodeURIComponent(name)
  }));
}

/* ---------- Download (works cross-origin via blob) ---------- */
async function downloadImage(img) {
  try {
    const res = await fetch(img.url);
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = img.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch {
    window.open(img.url, "_blank"); // fallback
  }
}

/* ---------- Gallery ---------- */
const grid = document.getElementById("grid");
let images = [];
let current = 0;

function render() {
  grid.innerHTML = "";
  images.forEach((img, i) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.tabIndex = 0;
    tile.setAttribute("role", "button");
    tile.setAttribute("aria-label", `Open ${img.name}`);

    const el = document.createElement("img");
    el.loading = "lazy";
    el.alt = img.name;
    el.src = img.url;
    el.onload = () => el.classList.add("loaded");

    const dl = document.createElement("button");
    dl.className = "dl";
    dl.title = "Download";
    dl.setAttribute("aria-label", `Download ${img.name}`);
    dl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
    dl.addEventListener("click", e => { e.stopPropagation(); downloadImage(img); });

    tile.append(el, dl);
    tile.addEventListener("click", () => openLightbox(i));
    tile.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(i); } });
    grid.appendChild(tile);
  });
}

/* ---------- Lightbox ---------- */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCount = document.getElementById("lbCount");

function show(i) {
  current = (i + images.length) % images.length;
  lbImg.src = images[current].url;
  lbImg.alt = images[current].name;
  lbCount.textContent = `${current + 1} / ${images.length}`;
}
function openLightbox(i) {
  show(i);
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  if (lb.requestFullscreen) lb.requestFullscreen().catch(() => {});
}
function closeLightbox() {
  lb.classList.remove("open");
  document.body.style.overflow = "";
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

document.getElementById("lbClose").onclick = closeLightbox;
document.getElementById("lbPrev").onclick = e => { e.stopPropagation(); show(current - 1); };
document.getElementById("lbNext").onclick = e => { e.stopPropagation(); show(current + 1); };
document.getElementById("lbDownload").onclick = e => { e.stopPropagation(); downloadImage(images[current]); };
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && lb.classList.contains("open")) closeLightbox();
});
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") show(current - 1);
  if (e.key === "ArrowRight") show(current + 1);
});

/* swipe on touch devices */
let touchX = null;
lb.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
  touchX = null;
});

/* ---------- Init ---------- */
(async () => {
  const status = document.getElementById("status");
  const subtitle = document.getElementById("subtitle");
  try {
    images = await loadImageList();
    if (!images.length) throw new Error(`No images found in the "${CONFIG.FOLDER}" folder.`);
    subtitle.textContent = `${images.length} photographs`;
    render();
  } catch (err) {
    subtitle.textContent = "";
    status.textContent = `Could not load images — ${err.message}. Make sure the images folder and build.js are in the repo.`;
  }
})();
</script>
</body>
</html>
